<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14202b">
<title>Лінія фронту</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#14202b;--panel:#1b2a38;--line:#2e4256;--txt:#e8eef4;--mut:#8fa3b5;--acc:#ffd23f;--font:"Trebuchet MS","Segoe UI",system-ui,sans-serif;--btn:#223445;--btnh:#2a4156;--btnon:#33485c;--accT:#1a1a1a;--ui:1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--txt);background:var(--bg);-webkit-tap-highlight-color:transparent}
@supports(height:100dvh){html,body{height:100dvh}}
button{font:inherit;color:inherit;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
#map{position:absolute;inset:0;background:#e9e5dc;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
#map.draw,#map.paint,#map.erase,#map.ua,#map.ru,#map.bua,#map.bru,#map.ruler{cursor:crosshair}
#map.pan{cursor:grab}
.leaflet-overlay-pane path:not(.leaflet-interactive){pointer-events:none}
.leaflet-control-layers-list{max-height:72vh;overflow:auto}
.leaflet-control-layers,.leaflet-control-zoom{zoom:var(--ui)}
.leaflet-control-layers-expanded{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px}
body.pr .leaflet-bottom.leaflet-right{right:auto;left:0}
#drop{position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;background:#000a;color:#fff;font-size:26px;font-weight:700;pointer-events:none}
#toast{position:fixed;z-index:3500;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-8px);background:var(--acc);color:var(--accT);font-weight:700;font-size:calc(14px*var(--ui));padding:.65em 1.1em;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 6px 20px #0006;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* кнопки */
button.t{font-size:.93em;padding:.55em .85em;border-radius:.7em;border:1px solid var(--line);background:var(--btn);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45em;line-height:1.2}
button.t:hover,.ib:hover,.tool:hover,.zc:hover{background:var(--btnh)}
button.t.on{border-color:var(--acc);background:var(--btnon);box-shadow:inset 0 0 0 1px var(--acc)}
button.t.pri{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:700}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.danger{border-color:#7a3030!important}
.ib{width:2.3em;height:2.3em;padding:0;border-radius:.7em;border:1px solid var(--line);background:var(--btn);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ib.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.ib.sm{width:1.9em;height:1.9em}
.ib svg,.tool svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib svg{width:1.25em;height:1.25em}
.swp{width:18px;height:18px;border-radius:50%;border:1px solid #fff9;flex:none}
.chk{display:flex;align-items:center;gap:.5em;margin:.4em 0;cursor:pointer;font-size:.95em}
.chk input{width:1.15em;height:1.15em;accent-color:var(--acc)}
input[type=range]{width:100%;height:1.8em;margin:.1em 0;accent-color:var(--acc)}
.row{display:flex;flex-wrap:wrap;gap:.4em}

/* главное меню */
#menu{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:#0b1118;overflow:hidden}
#menuBg{position:absolute;inset:0;z-index:0;pointer-events:none;background:#0b1118}
#menuShade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,#000e 0%,#000a 14%,#0004 32%,#0000 45%,#0000 55%,#0004 68%,#000a 86%,#000e 100%),radial-gradient(ellipse at center,#0000 35%,#0007 100%),#0003}
#menu .card{position:relative;z-index:2;width:min(26em,calc(100% - 28px));font-size:calc(15px*var(--ui));padding:2em 1.6em 1.5em;border-radius:1.4em;background:linear-gradient(180deg,var(--panel),var(--bg));border:1px solid var(--line);box-shadow:0 24px 70px #000a;max-height:calc(100% - 24px);overflow:auto}
#menu .card:before{content:"";position:absolute;left:1.6em;right:1.6em;top:0;height:4px;background:var(--acc);border-radius:0 0 4px 4px}
#menu h1{margin:0 0 .7em;font-size:2.2em;text-align:center;letter-spacing:.02em}
#mapsel{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
#mapsel .t{flex-direction:column;padding:.9em .4em;border-radius:.9em;gap:.25em;text-align:center}
#mapsel .mi{font-size:1.7em;line-height:1}
#credit{font-size:.78em;color:var(--mut);margin-top:.7em;line-height:1.4;text-align:center}
.big{display:block;width:100%;font-size:1.15em;font-weight:700;padding:.8em 1em;border:0;border-radius:.9em;background:var(--acc);color:var(--accT);cursor:pointer;margin-top:.7em;box-shadow:0 4px 14px #0004}
.big:hover{filter:brightness(1.08)}
.big.sec{background:var(--btn);color:var(--txt);border:1px solid var(--line);font-size:1em;font-weight:600;box-shadow:none;padding:.75em}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:.6em;margin-top:.6em}.duo .big{margin-top:0}

/* панель */
#panel{position:absolute;z-index:1000;top:12px;left:12px;width:var(--pw,calc(340px*var(--ui)));max-width:calc(100% - 24px);max-height:calc(100% - 24px);display:flex;flex-direction:column;font-size:calc(14px*var(--ui));background:var(--panel);border:1px solid var(--line);border-radius:1.2em;box-shadow:0 10px 30px #0007;overflow:hidden}
#panel.right{left:auto;right:12px;top:calc(52px*var(--ui));max-height:calc(100% - 64px)}
#presz{position:absolute;top:0;bottom:0;right:0;width:.9em;cursor:ew-resize;touch-action:none;z-index:3}
#panel.right #presz{right:auto;left:0}
#presz:after{content:"";position:absolute;right:.2em;top:50%;height:2.6em;width:3px;margin-top:-1.3em;border-radius:2px;background:var(--line)}
#panel.right #presz:after{right:auto;left:.2em}
#pgrip{display:none;height:1.5em;touch-action:none;cursor:ns-resize;flex:none;position:relative}
#pgrip:after{content:"";position:absolute;left:50%;top:.55em;width:3.2em;height:.35em;margin-left:-1.6em;border-radius:1em;background:var(--line)}
#phead{display:flex;align-items:center;gap:.4em;padding:.6em .7em;border-bottom:1px solid var(--line);flex:none}
#phead .ttl{flex:1;min-width:0;display:flex;align-items:center;gap:.5em;font-weight:700;font-size:1.05em}
#phead .ttl b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ptoggle svg{transition:transform .2s}
#panel.collapsed #ptoggle svg{transform:rotate(180deg)}
#panel.collapsed #pbody{display:none}
#panel.collapsed #phead{border-bottom:0}
#pbody{overflow:auto;padding:.7em;display:flex;flex-direction:column;gap:.95em;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:.76em;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:.5em;min-height:1.6em}
.lbl .val{text-transform:none;letter-spacing:0;color:var(--txt);font-size:1.1em}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:.4em}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35em;padding:.55em .1em;min-height:5.2em;border-radius:.9em;border:1px solid var(--line);background:var(--btn);font-size:.74em;line-height:1.1;text-align:center;cursor:pointer}
.tool svg{width:2.3em;height:2.3em}
.tool.on{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:700}
.fl,.bm{display:block;width:2.6em;height:1.7em;border-radius:3px}
.fl{border:1px solid #0008}
.fl.ua{background:linear-gradient(#0057b7 50%,#ffd700 50%)}
.fl.ru{background:linear-gradient(#fff 33.3%,#0039a6 33.3% 66.6%,#d52b1e 66.6%)}
.bm{display:flex;align-items:center;justify-content:center;border:2px solid;color:#fff}
.bm svg{width:1.6em;height:1em;stroke-width:1.8}
.bm.ua{background:#0057b7;border-color:#ffd700}.bm.ru{background:#b71c1c;border-color:#fff}
#zlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(9em,1fr));gap:.4em}
.zc{display:flex;align-items:center;gap:.55em;padding:.5em .6em;border-radius:.85em;border:1px solid var(--line);background:var(--btn);text-align:left;cursor:pointer;min-width:0}
.zc .sw,.sw{width:1.3em;height:1.3em;border-radius:50%;flex:none;border:2px solid #fff9;display:inline-block}
.zc .zn{display:flex;flex-direction:column;min-width:0}
.zc .zn b{font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zc .zn small{color:var(--mut);font-size:.78em}
.zc.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:var(--btnon)}
.zc.zadd{border-style:dashed;justify-content:center;color:var(--mut);gap:.4em}
#zed{margin-top:.6em;padding:.6em;border:1px solid var(--line);border-radius:.9em;background:var(--bg);display:flex;flex-direction:column;gap:.6em}
#zname,#bq{width:100%;font:inherit;font-size:.95em;padding:.55em .7em;border-radius:.7em;border:1px solid var(--line);background:var(--btn);color:var(--txt)}
#zpal{display:flex;flex-wrap:wrap;gap:.4em}
.pc{width:1.75em;height:1.75em;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px #0007}
.pc.on{border-color:var(--txt)}
.zrow{display:flex;gap:.4em;align-items:center}.zrow .sp{flex:1}
#zcol{width:2.4em;height:2.1em;padding:0;border:1px solid var(--line);border-radius:.6em;background:var(--btn)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em}.row3 .t{padding:.6em .2em;font-size:.88em}
details>summary{cursor:pointer;list-style:none;font-size:.76em;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:.5em}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"▸";transition:transform .15s}
details[open]>summary:before{transform:rotate(90deg)}
details>.dbody{margin-top:.5em}
#blist{max-height:15em;overflow:auto;display:flex;flex-direction:column;gap:.3em;margin-top:.4em}
#blist .t{justify-content:flex-start;text-align:left;padding:.4em .5em;line-height:1.25;font-size:.9em;border-radius:.6em}
#blist .bd{flex:none;min-width:3.2em;text-align:center;font-weight:700;font-size:.85em;padding:.25em .3em;border-radius:.3em;border:1px solid}
#blist .nm{font-size:.9em}
.frow{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em}
.frow .tool{min-height:4.2em}
#stats{font-size:.8em;color:var(--mut);text-align:center;line-height:1.5}
#set{position:fixed;inset:0;z-index:2500;display:flex;align-items:center;justify-content:center;background:#000a}
#set .card{background:var(--panel);border:1px solid var(--line);border-radius:1.2em;padding:1.1em;width:min(540px,calc(100% - 24px));max-height:90vh;overflow:auto;box-shadow:0 20px 60px #0008;font-size:calc(14px*var(--ui));display:flex;flex-direction:column;gap:1.1em}
.shead{display:flex;justify-content:space-between;align-items:center;font-size:1.25em}
.leaflet-container{font-family:var(--font)}

/* Прапори на мапі */
.flag{position:relative;width:30px;height:34px}
.flag:before{content:"";position:absolute;left:2px;top:0;width:3px;height:34px;background:#222;border-radius:2px}
.flag i{position:absolute;left:5px;top:1px;width:24px;height:16px;border:1px solid #222;box-shadow:0 1px 3px #0007}
.flag.ua i{background:linear-gradient(#0057b7 50%,#ffd700 50%)}
.flag.ru i{background:linear-gradient(#fff 33.3%,#0039a6 33.3% 66.6%,#d52b1e 66.6%)}
.bg{width:46px;height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 12px/1 "Trebuchet MS","Segoe UI",sans-serif;
border:2px solid;border-radius:3px;box-shadow:0 1px 4px #0009;cursor:grab;user-select:none;-webkit-user-select:none;white-space:nowrap}
.bg:active{cursor:grabbing}
.bgi{color:#fff;display:flex;line-height:0}
.bgi svg{display:block;width:28px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.bgi img{display:block;width:30px;height:18px;object-fit:contain}
.bgt{line-height:1}
.bic{display:flex;line-height:0;color:#fff;background:#0006;border-radius:3px;padding:2px 3px}
.bic svg{width:22px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bg.ua{background:#0057b7;border-color:#ffd700;color:#fff}
.bg.ru{background:#b71c1c;border-color:#fff;color:#fff}
#blist .bd.ua{background:#0057b7;border-color:#ffd700;color:#fff}
#blist .bd.ru{background:#b71c1c;border-color:#fff;color:#fff}
.rlab span{display:inline-block;transform:translate(-50%,-135%);background:var(--acc);color:var(--accT);font:700 12px/1 "Trebuchet MS","Segoe UI",sans-serif;padding:4px 7px;border-radius:3px;white-space:nowrap;box-shadow:0 1px 4px #0006}
@media(pointer:coarse){#panel{font-size:calc(15px*var(--ui))}#bq,#zname{font-size:16px}}
@media(max-width:560px){
#panel,#panel.right{top:auto;left:0;right:0;bottom:0;width:auto;max-width:none;border-radius:1.3em 1.3em 0 0;border-width:1px 0 0 0;max-height:54vh;padding-bottom:env(safe-area-inset-bottom)}
@supports(height:100dvh){#panel,#panel.right{max-height:min(54dvh,calc(100% - 16px))}}
#panel.sized{height:var(--ph);max-height:calc(100% - 16px)}
#presz{display:none}#pgrip{display:block}
.leaflet-control-zoom{display:none}
}
</style>
</head>
<body>

<div id="menu">
  <div id="menuBg"></div><div id="menuShade"></div>
  <div class="card">
    <h1 data-i="title"></h1>
    <div id="mapsel">
      <button class="t on" data-map="empty"><span class="mi">🗺</span><span data-i="map_empty"></span></button>
      <button class="t" data-map="real"><span class="mi">🛰</span><span data-i="map_real"></span></button>
    </div>
    <div id="credit" data-i="credit" hidden></div>
    <button class="big" id="menuResume" hidden></button>
    <button class="big" id="start" data-i="start"></button>
    <div class="duo">
      <button class="big sec" id="menuLoad" data-i="loadsave"></button>
      <button class="big sec" id="menuSet" data-i="settings"></button>
    </div>
  </div>
</div>

<div id="map"></div>

<div id="set" hidden>
  <div class="card">
    <div class="shead"><b data-i="settingsT"></b><button class="ib" id="setClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
    <div><div class="lbl"><span data-i="lang"></span></div><div class="row" id="langs"></div></div>
    <div><div class="lbl"><span data-i="uiSize"></span><span class="val" id="uiV"></span></div><input type="range" id="uiR" min="70" max="160" step="5"></div>
    <div><div class="lbl"><span data-i="themeF"></span></div><div class="row" id="thF"></div></div>
    <div><div class="lbl"><span data-i="themeP"></span></div><div class="row" id="thP"></div></div>
    <button class="t" id="setReset" data-i="uiReset"></button>
  </div>
</div>

<div id="panel" hidden>
  <div id="presz"></div><div id="pgrip"></div>
  <div id="phead">
    <div class="ttl"><span class="sw" id="curDot" hidden></span><b id="curName"></b></div>
    <button class="ib" id="hundo" data-tt="undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="ib" id="hredo" data-tt="redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    <button class="ib" id="pset" data-tt="settingsT"><svg viewBox="0 0 24 24"><path d="M4 6h9.8M18.2 6H20M4 12h2.8M11.2 12H20M4 18h8.8M17.2 18H20"/><circle cx="16" cy="6" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="15" cy="18" r="2.2"/></svg></button>
    <button class="ib" id="ptoggle" data-tt="collapse"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <div id="pbody">
    <div id="modes" class="tools">
      <button class="tool" data-mode="pan"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span data-i="m_pan"></span></button>
      <button class="tool" data-mode="draw"><svg viewBox="0 0 24 24"><path d="M5 17L8 7l9-2 3 9-8 6z"/><circle cx="5" cy="17" r="1.2" fill="currentColor"/><circle cx="8" cy="7" r="1.2" fill="currentColor"/><circle cx="17" cy="5" r="1.2" fill="currentColor"/><circle cx="20" cy="14" r="1.2" fill="currentColor"/><circle cx="12" cy="20" r="1.2" fill="currentColor"/></svg><span data-i="m_draw"></span></button>
      <button class="tool" data-mode="paint"><svg viewBox="0 0 24 24"><path d="M18.5 3.5l2 2L11 15l-2-2z"/><path d="M9 13c-2.5-.5-4.5 1-4.5 3.5 0 1.5-.8 2.5-1.5 3 3 .8 7 .5 7.5-3.5"/></svg><span data-i="m_paint"></span></button>
      <button class="tool" data-mode="erase"><svg viewBox="0 0 24 24"><path d="M20 20H9"/><path d="M5.5 14.5l8-8a2 2 0 013 0l3 3a2 2 0 010 3l-8 8H9l-3.5-3.5a2 2 0 010-2.5z"/><path d="M8.5 11.5l6 6"/></svg><span data-i="m_erase"></span></button>
      <button class="tool" data-mode="ruler"><svg viewBox="0 0 24 24"><path d="M3.5 16.5l13-13 4 4-13 13z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg><span data-i="m_ruler"></span></button>
      <button class="tool" data-mode="ua"><span class="fl ua"></span><span data-i="m_ua"></span></button>
      <button class="tool" data-mode="ru"><span class="fl ru"></span><span data-i="m_ru"></span></button>
      <button class="tool" data-mode="bua"><span class="bm ua"><svg viewBox="0 0 24 16"><path d="M3 1.5l18 13M21 1.5L3 14.5"/></svg></span><span data-i="m_bua"></span></button>
      <button class="tool" data-mode="bru"><span class="bm ru"><svg viewBox="0 0 24 16"><path d="M3 1.5l18 13M21 1.5L3 14.5"/></svg></span><span data-i="m_bru"></span></button>
      <button class="tool" data-mode="del"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 4h4M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg><span data-i="m_del"></span></button>
    </div>
    <div>
      <div class="lbl"><span data-i="zonecol"></span><button class="ib sm" id="zEditBtn" data-tt="zedit"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 012.8 0l.2.2a2 2 0 010 2.8L8 19z"/></svg></button></div>
      <div id="zlist"></div>
      <div id="zed" hidden>
        <input type="text" id="zname" maxlength="24" autocomplete="off">
        <div id="zpal"></div>
        <div class="zrow"><input type="color" id="zcol"><span data-i="zcol"></span><span class="sp"></span>
          <button class="t danger" id="zdel" data-i="zdel"></button><button class="t pri" id="zok" data-i="zok"></button></div>
      </div>
    </div>
    <div id="drawBox" hidden>
      <div class="row3"><button class="t pri" id="fin" data-i="finish"></button><button class="t" id="undo" data-i="stepback"></button><button class="t" id="cancel" data-i="cancel"></button></div>
      <label class="chk"><input type="checkbox" id="anOn" checked> <span><span data-i="anim"></span>: <span id="anv"></span></span></label>
      <input type="range" id="anT" min="0.5" max="5" step="0.5" value="1.5">
    </div>
    <div id="brushBox" hidden><div class="lbl"><span data-i="brush"></span><span class="val" id="bv"></span></div>
      <input type="range" id="brush" min="0" max="100" step="5" value="20"></div>
    <div id="eraseBox" hidden><div class="lbl"><span data-i="eraser"></span><span class="val" id="ev"></span></div>
      <input type="range" id="esize" min="1" max="300" step="1" value="40">
      <label class="chk"><input type="checkbox" id="eonly"> <span data-i="eonly"></span></label></div>

// ---------- Реальна лінія фронту (DeepStateMap через відкрите GitHub-дзеркало, завантажується при старті) ----------
const FRONT_TOL = 0.002;                               // спрощення геометрії, ° (~200 м): менше вершин — швидша гра
async function loadFront() {
  const RAW = 'https://raw.githubusercontent.com/cyterat/deepstate-map-data/main/data/';
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 30000);
  const get = async url => { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return r.json(); };
  try {
    let name = null, data = null;
    try {                                              // найновіший файл із папки data
      const list = await get('https://api.github.com/repos/cyterat/deepstate-map-data/contents/data');
      name = list.map(x => x.name).filter(n => /\.geojson$/.test(n)).sort().pop();
      if (name) data = await get(RAW + name);
    } catch (e) { data = null; }
    for (let i = 0; !data && i < 8; i++) {             // запасний шлях: перебираємо останні дні
      const d = new Date(Date.now() - i * 864e5), y = d.getUTCFullYear(), m = String(d.getUTCMonth() + 1).padStart(2, '0'), dd = String(d.getUTCDate()).padStart(2, '0');
      for (const x of [y + m + dd, y + '-' + m + '-' + dd]) {
        try { name = 'deepstatemap_data_' + x + '.geojson'; data = await get(RAW + name); break; } catch (e) { data = null; }
      }
    }
    if (!data) return null;
    const polys = [];
    (data.features || [data]).forEach(f => {
      const g = f.type === 'Feature' ? f.geometry : f;
      if (!g) return;
      if (g.type === 'Polygon') polys.push(g.coordinates); else if (g.type === 'MultiPolygon') g.coordinates.forEach(p => polys.push(p));
    });
    if (!polys.length) return null;
    let mp = turf.multiPolygon(polys);
    try { mp = turf.simplify(mp, { tolerance: FRONT_TOL, highQuality: true }); } catch (e) { console.error(e); }
    try { const u = turf.union(mp, mp); if (u) mp = u; } catch (e) { console.error(e); }   // прибираємо самоперетини після спрощення
    const keep = [];
    turf.flatten(mp).features.forEach(p => { if (turf.area(p) > 3e5) keep.push(p.geometry.coordinates); });   // відкидаємо дрібні острівці
    if (!keep.length) return null;
    const m = (name || '').match(/(\d{4})-?(\d{2})-?(\d{2})/);
    return { geometry: { type: 'MultiPolygon', coordinates: keep }, date: m ? m[1] + '-' + m[2] + '-' + m[3] : '' };
  } catch (e) { console.error(e); return null; } finally { clearTimeout(to); }
}

function finish() {

// ---------- Анімація просування фронту ----------
// Дані змінюються одразу. Поки йде анімація, справжній шар зон прихований, а на екрані — «візуальний» стан:
// початкова карта, на яку по черзі накладено вже відкриті частини кожної фігури. Тому кілька анімацій можуть іти одночасно.
let anims = [], base = null, aRaf = 0, aLast = 0, aStatic = null, aDyn = null, aDynZ = [];
function startShape(j) {
  let geom = j.geom;
  if (j.st === 'free') {                             // «Звільнено» можна малювати лише поверх «Окупації» та «Йдуть бої»
    geom = clipToEnemy(geom);
    if (!geom) return toast(t('t_fonly'));
  }
  const idle = !anims.length;
  if (idle) base = zones.map(z => ({ status: z.status, f: z.f }));      // стан ДО змін
  const A = $('anOn').checked ? prepAnim(j.st, geom, j.first) : null;
  const z = addZone(j.st, geom); carve(z); mergeSame(z); const S = ST[j.st].b ? autoBuffer(false, turf.bbox(geom)) : false; stats();
  const mk = (g, extra) => {                         // одна анімація = фігура + сіра смуга, що відкриваються разом
    const parts = [{ st: j.st, g }];
    if (S) parts.push({ st: 'fight', g: S });
    return Object.assign({ parts, AG: turf.featureCollection(parts.map(p => p.g)) }, extra);
  };
  if (A) {
    anims.push(mk(A.AG, { c: A.c, r0: A.r0, r1: Math.max(A.r1, farthest(A.c, S)), t0: performance.now(), T: +$('anT').value * 1000, done: false }));
    if (idle) beginAnim(); else { rebuildStatic(); renderAnim(performance.now()); }
  } else if (!idle) {                                // анімацію вимкнено, але інші ще йдуть — ця фігура з'являється миттєво
    anims.push(mk({ type: 'Feature', properties: {}, geometry: geom }, { done: true }));
    rebuildStatic(); renderAnim(performance.now());
  } else base = null;
}
const flatC = (c, out) => { if (typeof c[0] === 'number') out.push(c); else c.forEach(x => flatC(x, out)); return out; };
function farthest(c, G) {
  let m = 0;
  if (G) flatC(G.geometry.coordinates, []).forEach(p => { const d = turf.distance(c, p, { units: 'kilometers' }); if (d > m) m = d; });
  return m;
}
// Анімація розходиться колом від ПЕРШОЇ точки, з якої почато малювання фігури, у бік наступу
function prepAnim(st, geom, first) {
  try {

    const same = zones.filter(z => z.status === st);
    let AG = G, S = null;
    for (const z of same) { S = S ? turf.union(S, z.f) : z.f; if (!S) break; }
    if (S) { AG = turf.difference(G, S); if (!AG) return null; }

    let r0 = 0;
    if (!turf.booleanPointInPolygon(pc, AG)) {         // стартова точка поза новою ділянкою — рахуємо від її краю
      r0 = Infinity;
      turf.flatten(AG).features.forEach(pl => {
        const np = turf.nearestPointOnLine(turf.polygonToLine(pl), pc, { units: 'kilometers' });
        if (np.properties.dist < r0) r0 = np.properties.dist;
      });
      if (!isFinite(r0)) r0 = 0;
    }
    const r1 = farthest(c, AG);
    if (!(r1 - r0 > 1e-6)) return null;
    return { AG, c, r0, r1 };
  } catch (err) { console.error(err); return null; }
}
const zanimStyle = ft => zStyle(ft.properties.s);
const mkAL = () => L.geoJSON(null, { style: zanimStyle, interactive: false, pane: 'zanim' }).addTo(map);
const bboxOv = (a, b) => !(a[2] < b[0] || a[0] > b[2] || a[3] < b[1] || a[1] > b[3]);
// Зони, що не торкаються жодної анімації, малюємо один раз; решту перераховуємо щокадру
function rebuildStatic() {
  let bb = null;
  anims.forEach(a => {
    const b = a.bb || (a.bb = turf.bbox(a.AG));
    bb = bb ? [Math.min(bb[0], b[0]), Math.min(bb[1], b[1]), Math.max(bb[2], b[2]), Math.max(bb[3], b[3])] : b.slice();
  });
  aStatic.clearLayers(); aDynZ = [];
  base.forEach(z => {
    const zb = z.bb || (z.bb = turf.bbox(z.f));
    if (bb && bboxOv(zb, bb)) aDynZ.push(z);

}
function beginAnim() {
  aStatic = mkAL(); aDyn = mkAL();
  map.getPane('zanim').style.display = ''; map.getPane('zones').style.display = 'none';
  rebuildStatic(); renderAnim(performance.now());
  aLast = performance.now(); aRaf = requestAnimationFrame(animFrame);
}
function endAnim() {
  cancelAnimationFrame(aRaf);
  if (aStatic) { map.removeLayer(aStatic); aStatic = null; }
  if (aDyn) { map.removeLayer(aDyn); aDyn = null; }
  map.getPane('zanim').style.display = 'none'; map.getPane('zones').style.display = '';
  anims = []; base = null; aDynZ = [];
}
function flushAnim() { if (anims.length) endAnim(); }   // оголюємо справжній шар зон (дані вже актуальні)
function renderAnim(now) {
  let V = aDynZ.map(z => ({ s: z.status, f: z.f }));
  for (const a of anims) {
    let H = null;                                    // відкрите на цей момент коло (null — усе)
    if (!a.done) {
      const t = Math.min(1, (now - a.t0) / a.T);
      if (t >= 1) a.done = true;
      else if (t <= 0) continue;
      else {
        const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        try { H = turf.circle(a.c, Math.max(a.r0 + (a.r1 - a.r0) * e, 0.001), { steps: 64, units: 'kilometers' }); }
        catch (err) { console.error(err); continue; }
      }
    }
    for (const pc of a.parts) {                      // фігура й сіра смуга ріжуться одним і тим самим колом
      let part = pc.g;
      if (H) { try { part = turf.intersect(pc.g, H); } catch (err) { console.error(err); part = null; } }
      if (!part) continue;
      const nv = [];
      for (const v of V) {                            // нова ділянка вирізається з усього, що було під нею
        let hit = false;
        try { hit = turf.booleanIntersects(v.f, part); } catch (err) { hit = false; }
        if (!hit) { nv.push(v); continue; }
        try { const d = turf.difference(v.f, part); if (d) nv.push({ s: v.s, f: d }); } catch (err) { nv.push(v); }
      }
      nv.push({ s: pc.st, f: part });
      V = nv;
    }
  }
  aDyn.clearLayers();
  const by = {};                                      // шматки одного статусу зливаємо в одну фігуру — без «швів» і ліній між ними
  V.forEach(v => { (by[v.s] = by[v.s] || []).push(v.f); });
  Object.keys(by).forEach(st => {
    let u = null;
    by[st].forEach(f => {
      if (!u) { u = f; return; }
      try { const x = turf.union(u, f); if (x) { u = x; return; } } catch (err) { /* додамо окремо */ }
      aDyn.addData({ type: 'Feature', properties: { s: st }, geometry: f.geometry });
    });
    if (u) aDyn.addData({ type: 'Feature', properties: { s: st }, geometry: u.geometry });

}
function animFrame(now) {
  if (!anims.length) return;

// Обрізає геометрію по окупованих і сірих зонах: все, що поза ними (порожня карта, звільнені зони), відкидається
function clipToEnemy(geom) {
  try {
    let area = null;
    for (const o of zones) {
      if (o.status !== 'occ' && o.status !== 'fight') continue;
      area = area ? turf.union(area, o.f) : o.f;
      if (!area) return null;
    }
    if (!area) return null;
    const r = turf.intersect({ type: 'Feature', properties: {}, geometry: geom }, area);
    return r ? r.geometry : null;
  } catch (err) { console.error(err); return null; }
}
// Нова фігура вирізає свою площу із зон іншого статусу — перекриттів і подвійного підрахунку немає
function carve(z, soft) {
  try {
    for (const o of [...zones]) {
      if (o === z || o.status === z.status || (soft && !ST[o.status].b) || !turf.intersect(o.f, z.f)) continue;
      const d = turf.difference(o.f, z.f), st = o.status;

}

// ---------- Покраска (в межах існуючої зони) ----------
function paintAt(ll, quiet) {
  flushAnim();
  const pt = turf.point([ll.lng, ll.lat]);
  const z = [...zones].reverse().find(z => turf.booleanPointInPolygon(pt, z.f));
  if (!z) return quiet ? 0 : toast(t('t_inz'));
  if (z.status === status) return quiet ? 0 : toast(t('t_same'));
  const r = +$('brush').value;
  if (r === 0) { z.status = status; refreshZone(z); mergeSame(z); return stats(); }
  try {
    const circ = turf.circle(pt, r, { steps: 64, units: 'kilometers' });
    const inside = turf.intersect(z.f, circ);          // частина кола всередині зони
    if (!inside) return;
    const rest = turf.difference(z.f, circ);           // решта зони зберігає старий колір
    const old = z.status;
    delZone(z);
    if (rest) addZone(old, rest.geometry);
    mergeSame(addZone(status, inside.geometry));
  } catch (err) { console.error(err); toast(t('t_cut')); }
  stats();
}
function clearGhost() { if (ghost) { map.removeLayer(ghost); ghost = null; } if (eGhost) { map.removeLayer(eGhost); eGhost = null; } }

// ---------- Ластик (стирає шматочок зони, розмір у пікселях екрана) ----------
function eraseAt(px) {
  flushAnim();
  const d = +$('esize').value, r = d / 2, only = $('eonly').checked;
  const ring = [];
  for (let i = 0; i < 48; i++) {                         // коло рівно того розміру, що видно на екрані
    const a = i / 48 * Math.PI * 2;
    const ll = map.containerPointToLatLng(L.point(px.x + r * Math.cos(a), px.y + r * Math.sin(a)));
    ring.push([ll.lng, ll.lat]);
  }
  ring.push(ring[0]);
  const circ = turf.polygon([ring]);
  let changed = false;
  for (const z of [...zones]) {
    if (only && z.status !== status) continue;
    try {
      if (!turf.booleanIntersects(z.f, circ)) continue;
      const left = turf.difference(z.f, circ), st = z.status;
      delZone(z);
      if (left) addZone(st, left.geometry);
      changed = true;
    } catch (err) { console.error(err); }
  }
  return changed;
}
// Рухаємося від попередньої точки до нової з малим кроком, щоб швидка рука не лишала прогалин
function eraseTo(px) {
  const d = +$('esize').value, step = Math.max(1, d * 0.25);
  const dist = lastErasePx.distanceTo(px);
  const n = Math.min(40, Math.max(1, Math.ceil(dist / step)));
  let changed = false;
  for (let i = 1; i <= n; i++) {
    const t = i / n;
    const p = L.point(lastErasePx.x + (px.x - lastErasePx.x) * t, lastErasePx.y + (px.y - lastErasePx.y) * t);
    if (eraseAt(p)) changed = true;
  }
  lastErasePx = px;
  if (changed) stats();
}

// ---------- Прапори (прив'язка до зони / лінії фронту) ----------
function flagAt(ll, side) {
  const need = side === 'ua' ? 'free' : 'occ';
  const mpp = 40075016.686 * Math.cos(ll.lat * Math.PI / 180) / Math.pow(2, map.getZoom() + 8);
  const limit = 40 * mpp;                               // радіус прив'язки ≈ 40 px
  const pt = turf.point([ll.lng, ll.lat]);
  let inside = false, best = null, bd = Infinity;
  try {
    for (const z of zones) {
      if (z.status !== need) continue;
      if (turf.booleanPointInPolygon(pt, z.f)) { inside = true; break; }
      turf.flatten(z.f).features.forEach(p => {
        const np = turf.nearestPointOnLine(turf.polygonToLine(p), pt, { units: 'meters' });
        if (np.properties.dist < bd) { bd = np.properties.dist; best = np.geometry.coordinates; }
      });
    }
  } catch (err) { console.error(err); }
  if (inside) return addFlag(side, ll.lat, ll.lng), stats();
  if (best && bd <= limit) return addFlag(side, best[1], best[0]), stats();
  toast(side === 'ua' ? t('t_fua') : t('t_fru'));
}

// ---------- Кнопки історії, гарячі клавіші, згортання панелі ----------
$('hundo').onclick = doUndo; $('hredo').onclick = doRedo;
$('ptoggle').onclick = () => $('panel').classList.toggle('collapsed');
document.addEventListener('keydown', e => {
  if ($('panel').hidden) return;
  if (e.key === 'Escape' && mode === 'ruler') { rClear(); return; }
  if (!(e.ctrlKey || e.metaKey)) return;
  const tg = e.target;
  if (tg && (tg.tagName === 'TEXTAREA' || (tg.tagName === 'INPUT' && /^(text|search)$/.test(tg.type)))) return;
  if (e.code === 'KeyZ' && !e.shiftKey) {
    e.preventDefault();
    if (mode === 'draw' && pts.length) { pts.pop(); redrawTmp(); } else doUndo();   // у фігурі, що малюється, Ctrl+Z знімає останню точку
  } else if (e.code === 'KeyY' || (e.code === 'KeyZ' && e.shiftKey)) { e.preventDefault(); doRedo(); }
});

// ---------- Відновлення автозбереження ----------
function readAuto() {
  try {
    const t = localStorage.getItem(AS_KEY); if (!t) return null;
    const p = parseSave(t); p.at = JSON.parse(t).savedAt;
    return (p.zs.length || p.fs.length || p.bs.length) ? p : null;
  } catch (err) { return null; }
}
const auto0 = readAuto();
if (auto0) {
  $('menuResume').hidden = false;
  $('start').dataset.i = 'newgame'; $('start').classList.add('sec');
  $('menuResume').onclick = () => { startGame(); applySave(auto0); resetHist(); toast(t('t_restored')); };
}

function updAn() { $('anv').textContent = (+$('anT').value).toFixed(1).replace('.', decSep()) + ' ' + t('sec'); }
$('anT').oninput = updAn; updAn();
function applyTheme() {
  const th = THEMES.find(x => x[0] === cfg.theme) || THEMES.find(x => x[0] === 'blue'), v = th[3].split(' '), st = document.documentElement.style;
  TKEYS.forEach((k, i) => st.setProperty('--' + k, v[i]));
  st.setProperty('--font', th[4] || DEF_FONT);
}
function renderSettings() {
  const mk = (cls, label, on, fn, sw) => {
    const b = document.createElement('button'); b.className = 't' + (on ? ' on' : '');
    if (sw) { const s = document.createElement('span'); s.className = 'swp'; s.style.background = 'linear-gradient(135deg,' + sw[0] + ' 50%,' + sw[1] + ' 50%)'; b.appendChild(s); }
    b.appendChild(document.createTextNode(label)); b.onclick = fn; return b;
  };
  $('uiR').value = Math.round(cfg.ui * 100); $('uiV').textContent = Math.round(cfg.ui * 100) + '%';
  const L = $('langs'); L.textContent = '';
  [['uk', 'Українська'], ['en', 'English'], ['ru', 'Русский']].forEach(([c, n]) =>
    L.appendChild(mk('', n, cfg.lang === c, () => { cfg.lang = c; saveCfg(); applyLang(); })));
  [[$('thF'), 'f'], [$('thP'), 'p']].forEach(([box, g]) => {
    box.textContent = '';
    THEMES.filter(x => x[1] === g).forEach(x => {
      const v = x[3].split(' ');
      box.appendChild(mk('', x[2].split('|')[LIDX[cfg.lang]], cfg.theme === x[0], () => { cfg.theme = x[0]; saveCfg(); applyTheme(); renderSettings(); }, [v[0], v[5]]));
    });
  });
}
const openSet = () => { renderSettings(); $('set').hidden = false; };
const closeSet = () => { $('set').hidden = true; };
$('menuSet').onclick = openSet; $('pset').onclick = openSet; $('setClose').onclick = closeSet;
$('set').addEventListener('click', e => { if (e.target === $('set')) closeSet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('set').hidden) closeSet(); });
function resumeLabel() {
  if (!auto0) return;
  const dt = auto0.at ? new Date(auto0.at) : null;
  $('menuResume').textContent = t('resume') + (dt && !isNaN(dt) ? ' (' + dt.toLocaleString(LOC[cfg.lang], { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + ')' : '');
}
function applyLang() {
  document.documentElement.lang = cfg.lang; document.title = t('title');
  document.querySelectorAll('[data-i]').forEach(e => { e.textContent = t(e.dataset.i); });
  document.querySelectorAll('[data-ph]').forEach(e => { e.placeholder = t(e.dataset.ph); });
  document.querySelectorAll('[data-tt]').forEach(e => { e.setAttribute('aria-label', t(e.dataset.tt)); });
  buildLayersCtl(); fillEditor(); updHead(); updBrush(); updAn(); updBuf(); renderStats(); resumeLabel(); renderSettings();
}

// ---------- Розмір і положення інтерфейсу ----------
function applyUI() {
  document.documentElement.style.setProperty('--ui', cfg.ui);
  const p = $('panel');
  cfg.pw ? p.style.setProperty('--pw', cfg.pw + 'px') : p.style.removeProperty('--pw');
  cfg.ph ? p.style.setProperty('--ph', cfg.ph + 'px') : p.style.removeProperty('--ph');
  p.classList.toggle('sized', !!cfg.ph);
}
function dragEl(el, fn) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (_) {}
    const up = () => { el.removeEventListener('pointermove', fn); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); saveCfg(); };
    el.addEventListener('pointermove', fn); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
}
dragEl($('presz'), e => { const r = $('panel').getBoundingClientRect(); cfg.pw = Math.round(Math.max(240, Math.min(e.clientX - r.left, 700, innerWidth - 24))); applyUI(); });
dragEl($('pgrip'), e => { $('panel').classList.remove('collapsed'); cfg.ph = Math.round(Math.max(120, Math.min(innerHeight - e.clientY, innerHeight * 0.9))); applyUI(); });
$('uiR').oninput = e => { cfg.ui = +e.target.value / 100; $('uiV').textContent = e.target.value + '%'; applyUI(); saveCfg(); };
$('setReset').onclick = () => { cfg.ui = 1; cfg.pw = 0; cfg.ph = 0; saveCfg(); applyUI(); renderSettings(); };

// Фон меню — карта світу (супутник) із затемненням по боках
let menuMap = null;
try {
  const z = Math.min(4, Math.max(2, Math.round(Math.log2(innerWidth / 256))));
  menuMap = L.map('menuBg', { zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
    boxZoom: false, keyboard: false, touchZoom: false, tap: false, worldCopyJump: true }).setView([38, 22], z);
  esriL('World_Imagery', 18).addTo(menuMap);
} catch (e) { console.error(e); }
applyTheme(); applyUI(); applyLang();
</script>
</body>
</html>
